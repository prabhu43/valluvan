services:
  qdrant:
    image: qdrant/qdrant:v1.10.1
    container_name: valluvan-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # The qdrant image has bash but no curl/wget; use a /dev/tcp probe.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: valluvan-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-valluvan}
      POSTGRES_USER: ${POSTGRES_USER:-valluvan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-valluvan}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_storage:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-valluvan}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    container_name: valluvan-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Passed through to the provisioned Postgres datasource (see
      # monitoring/grafana/provisioning/datasources/postgres.yml)
      POSTGRES_DB: ${POSTGRES_DB:-valluvan}
      POSTGRES_USER: ${POSTGRES_USER:-valluvan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-valluvan}
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_storage:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # One-shot: embed + upsert all 1330 kurals into Qdrant, then exit. Idempotent
  # (skips if already populated unless FORCE_REINGEST=true). `app` waits for it.
  ingest:
    build: .
    image: valluvan-app
    container_name: valluvan-ingest
    command: ["python", "ingestion/ingest.py"]
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
    volumes:
      - models_cache:/models
    depends_on:
      qdrant:
        condition: service_healthy
    restart: "no"

  # The Streamlit chat UI.
  app:
    build: .
    image: valluvan-app
    container_name: valluvan-app
    ports:
      - "${APP_PORT:-8501}:8501"
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
      POSTGRES_HOST: postgres
    volumes:
      - models_cache:/models
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
      ingest:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  qdrant_storage:
  postgres_storage:
  grafana_storage:
  models_cache:
