apiVersion: 1

# Auto-load any dashboard JSON found under the mounted dashboards folder.
providers:
  - name: Valluvan
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
